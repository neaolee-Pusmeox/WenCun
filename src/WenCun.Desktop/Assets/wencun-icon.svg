    <path d="M132 344H510" fill="none" stroke="#C4D2AC" stroke-opacity=".37" stroke-width="7" stroke-linecap="round"/>
    <path d="M109 397V455C109 492 137 520 174 520" fill="none" stroke="#B5C69D" stroke-opacity=".16" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="269" cy="358" rx="115" ry="9" fill="#E0E4BD" opacity=".11" filter="url(#soft-light)"/>
