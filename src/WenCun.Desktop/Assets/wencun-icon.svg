    <linearGradient id="paper-line" x1="236" y1="206" x2="416" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#557460"/>
      <stop offset="1" stop-color="#365746"/>
    </linearGradient>
    <linearGradient id="pocket-back" x1="165" y1="287" x2="480" y2="512" gradientUnits="userSpaceOnUse">
