<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="ground" x1="76" y1="52" x2="568" y2="608" gradientUnits="userSpaceOnUse">
      <stop stop-color="#356C56"/>
      <stop offset="1" stop-color="#173B32"/>
    </linearGradient>
    <radialGradient id="ground-light" cx="0" cy="0" r="1" gradientTransform="translate(151 103) rotate(51) scale(485)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CA88A" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8CA88A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="213" y1="118" x2="490" y2="396" gradientUnits="userSpaceOnUse">
