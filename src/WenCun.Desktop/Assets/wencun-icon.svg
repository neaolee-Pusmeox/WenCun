    <filter id="subject-shadow" x="-30%" y="-30%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="23" stdDeviation="19" flood-color="#0C241D" flood-opacity=".34"/>
    </filter>
    <filter id="paper-shadow" x="-30%" y="-30%" width="170%" height="180%" color-interpolation-filters="sRGB">
