      <path d="M228 113H493C519 113 541 134 541 160" fill="none" stroke="#FFFFFF" stroke-opacity=".66" stroke-width="7" stroke-linecap="round"/>
      <rect x="229" y="209" width="209" height="31" rx="15.5" fill="url(#paper-line)"/>
